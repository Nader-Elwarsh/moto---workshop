name: فحص الكود

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: فحص الـ syntax
        run: node tool-check.mjs
      - name: الاختبارات
        run: node --test *.test.js
